image {
    path = ~/.config/hypr/assets/light/yorha.webp
    border_size = 0
    size = 500
    rounding = 1
    position = -575, -20
}

label {
    font_size = 280
    position = 190, 25
    color = rgba($TAN$HIGH_OPACITY)
    text = cmd[update:0] echo "<span letter_spacing='-2500'>Yo</span><span size='30000'> </span><span letter_spacing='35000'>RHa</span>"
    font_family = Fortune City
}

label {
    fade_on_empty = false
    position = 190, -150
    color = rgb($TAN)
    text = cmd[update:0] echo "<span letter_spacing='7345' size='67200'>For</span><span letter_spacing='8500' size='67200'> the</span><span size='50000'> </span><span letter_spacing='11250' size='67200'>Glor</span><span size='18750'> </span><span size='67200'>y</span><span size='45000'> </span><span letter_spacing='11250' size='67200'>of</span><span size='30000'> </span><span letter_spacing='10000' size='67200'>Mankind</span>"
    font_family = Fortune City
}

